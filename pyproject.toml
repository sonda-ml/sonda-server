[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonda-server"
version = "0.1.0"
description = "A /v1/systemone decision server for sonda models: batched, validated, per-type temperatures"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# torch and transformers come from the CUDA environment the model runs in (extra "gpu"); they are not
# installed by default, so an existing GPU build is never replaced.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "orjson>=3.9",
  "pydantic>=2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=5.0"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sonda-server = "sonda_server.cli:main"

[tool.setuptools.packages.find]
include = ["sonda_server*"]

[tool.setuptools.package-data]
sonda_server = ["web/*.html", "web/*.json"]

